name: Build sH1zoLauncher APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        id: p
        run: |
          ZIP=$(ls *fixed*.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then ZIP=$(ls *.zip 2>/dev/null | head -n1 || true); fi
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            mkdir proj && unzip -q "$ZIP" -d proj
            echo "dir=proj" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Accept Android licenses
